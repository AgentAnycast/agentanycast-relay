services:
  relay:
    build: .
    ports:
      - "4001:4001/tcp"
      - "4001:4001/udp"
      - "8080:8080/tcp"
    volumes:
      - relay-data:/data
    command:
      - "--listen=/ip4/0.0.0.0/tcp/4001"
      - "--key=/data/key"
      - "--max-reservations=128"
      - "--mcp-listen=:8080"
      - "--log-level=info"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.25'

volumes:
  relay-data:
