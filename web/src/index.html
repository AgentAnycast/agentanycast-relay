<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgentAnycast — Agent Directory</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #0f1117;
        --surface: #1a1d27;
        --border: #2a2d3a;
        --text: #e4e4e7;
        --text-muted: #9ca3af;
        --accent: #6366f1;
        --accent-hover: #818cf8;
        --green: #22c55e;
        --yellow: #eab308;
        --red: #ef4444;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
      }
      #app {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 32px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border);
      }
      header h1 {
        font-size: 1.5rem;
        font-weight: 600;
      }
      header h1 span {
        color: var(--accent);
      }
      nav {
        display: flex;
        gap: 4px;
      }
      nav button {
        padding: 8px 16px;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 0.875rem;
        transition: all 0.15s;
      }
      nav button:hover {
        background: var(--surface);
        color: var(--text);
      }
      nav button.active {
        background: var(--accent);
        color: white;
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        margin-bottom: 32px;
      }
      .stat-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 20px;
      }
      .stat-card .label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
        margin-bottom: 4px;
      }
      .stat-card .value {
        font-size: 2rem;
        font-weight: 700;
      }
      .search-box {
        width: 100%;
        padding: 12px 16px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-size: 0.875rem;
        margin-bottom: 24px;
        outline: none;
        transition: border-color 0.15s;
      }
      .search-box:focus {
        border-color: var(--accent);
      }
      .search-box::placeholder {
        color: var(--text-muted);
      }
      .agent-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .agent-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 20px;
        transition: border-color 0.15s;
      }
      .agent-card:hover {
        border-color: var(--accent);
      }
      .agent-card .agent-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .agent-card .agent-name {
        font-weight: 600;
        font-size: 1rem;
      }
      .agent-card .agent-origin {
        font-size: 0.75rem;
        color: var(--text-muted);
        background: var(--bg);
        padding: 2px 8px;
        border-radius: 4px;
      }
      .agent-card .peer-id {
        font-family: monospace;
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-bottom: 12px;
      }
      .skills-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .skill-badge {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 4px 10px;
        font-size: 0.75rem;
        color: var(--accent);
      }
      .skill-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .skill-card .skill-name {
        font-weight: 600;
        font-family: monospace;
      }
      .skill-card .agent-count {
        background: var(--accent);
        color: white;
        border-radius: 12px;
        padding: 2px 10px;
        font-size: 0.875rem;
        font-weight: 600;
      }
      .loading {
        text-align: center;
        padding: 48px;
        color: var(--text-muted);
      }
      .error {
        text-align: center;
        padding: 24px;
        color: var(--red);
        background: var(--surface);
        border: 1px solid var(--red);
        border-radius: 8px;
      }
      .empty {
        text-align: center;
        padding: 48px;
        color: var(--text-muted);
      }
      .federation-peer {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .federation-peer .addr {
        font-family: monospace;
        font-size: 0.875rem;
      }
      .status-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        margin-right: 8px;
      }
      .status-dot.healthy {
        background: var(--green);
      }
      .status-dot.unhealthy {
        background: var(--red);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="app.js"></script>
  </body>
</html>
